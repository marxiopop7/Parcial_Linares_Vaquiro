<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Simulador CDT</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" type="text/css" href="css/estilos.css" />
    </h:head>
    <h:body>
        
        <div class="info-section">
            <p:panel header="¿Qué es un CDT?" styleClass="custom-panel">
                <h:outputText value="Un Certificado de Depósito a Término (CDT) es un instrumento de inversión mediante el cual depositas una cantidad de dinero en una entidad financiera por un plazo determinado. A cambio, la entidad te devuelve el dinero invertido más unos intereses." />
            </p:panel>
        </div>

        <h:form id="formularioCdt">
            <p:growl id="msgs" showDetail="true" />
            
            <p:panel header="#{cdtBean.modoEdicion ? 'Editar CDT' : 'Simulador CDT - Registro'}" styleClass="custom-panel">
                
                <div class="ui-fluid">
                    <p:panelGrid columns="4" layout="grid" columnClasses="ui-grid-col-2, ui-grid-col-4, ui-grid-col-2, ui-grid-col-4">
                        
                        <p:outputLabel value="Identificación:" for="docId"/>
                        <p:inputText id="docId" value="#{cdtBean.cdt.cliente.docId}" required="true" requiredMessage="La identificación es obligatoria"/>

                        <p:outputLabel value="Nombre(s):" for="nombre"/>
                        <p:inputText id="nombre" value="#{cdtBean.cdt.cliente.nombre}" required="true" requiredMessage="El nombre es obligatorio"/>

                        <p:outputLabel value="Apellidos:" for="apellido"/>
                        <p:inputText id="apellido" value="#{cdtBean.cdt.cliente.apellido}" required="true" requiredMessage="El apellido es obligatorio"/>

                        <p:outputLabel value="Correo Electrónico:" for="correo"/>
                        <p:inputText id="correo" value="#{cdtBean.cdt.cliente.correo}" required="true" requiredMessage="El correo es obligatorio" type="text"/>

                        <p:outputLabel value="Teléfono:" for="telefono"/>
                        <p:inputText id="telefono" value="#{cdtBean.cdt.cliente.telefono}" required="true" requiredMessage="El teléfono es obligatorio"/>

                        <p:outputLabel for="inversion" value="Inversión ($):"/>
                        <p:inputNumber id="inversion" value="#{cdtBean.cdt.inversion}" required="true" requiredMessage="La inversión es obligatoria" decimalPlaces="2" symbol="$ "/>

                        <p:outputLabel for="tasa" value="Tasa anual (%):"/>
                        <p:inputNumber id="tasa" value="#{cdtBean.cdt.tasaInteresesAnual}" required="true" requiredMessage="La tasa es obligatoria" decimalPlaces="2" symbol="%" symbolPosition="s"/>

                        <p:outputLabel for="plazo" value="Plazo (Días):"/>
                        <p:spinner id="plazo" value="#{cdtBean.cdt.plazoDias}" required="true" requiredMessage="El plazo es obligatorio" />
                        
                    </p:panelGrid>
                </div>

                <p:divider />

                <p:commandButton value="#{cdtBean.modoEdicion ? 'Actualizar CDT' : 'Calcular y Guardar'}" action="#{cdtBean.calcular}" update="formularioCdt, :formTabla, msgs" styleClass="ui-button-success" icon="pi pi-check" />
                <p:commandButton value="Limpiar / Cancelar" action="#{cdtBean.limpiar}" process="@this" update="formularioCdt" styleClass="ui-button-secondary" icon="pi pi-times" style="margin-left: 10px;" />
            </p:panel>
        </h:form>

        <div class="table-section">
            <h:form id="formTabla">
                <p:panel header="Datos Calculados y Registrados" styleClass="custom-panel">
                    <p:dataTable id="tablaResultados" value="#{cdtBean.listaHistorico}" var="hist" emptyMessage="No hay registros." responsiveLayout="scroll">
                        
                        <p:column headerText="Documento">
                            <h:outputText value="#{hist.cliente.docId}" />
                        </p:column>
                        
                        <p:column headerText="Cliente">
                            <h:outputText value="#{hist.cliente.nombre} #{hist.cliente.apellido}" />
                        </p:column>

                        <p:column headerText="Inversión">
                            <h:outputText value="#{hist.inversion}">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="Ganancia antes de retención">
                            <h:outputText value="#{hist.gananciaBruta}">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Retención">
                            <h:outputText value="#{hist.retencionFuente}">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="Ganancia Neta">
                            <h:outputText value="#{hist.gananciaNeta}">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="Ganancia Total">
                            <strong>
                                <h:outputText value="#{hist.valorTotal}">
                                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                                </h:outputText>
                            </strong>
                        </p:column>

                        <p:column headerText="Acciones" style="width:120px; text-align: center;">
                            <p:commandButton icon="pi pi-pencil" action="#{cdtBean.perpararEdicion(hist)}" process="@this" update=":formularioCdt" styleClass="ui-button-warning rounded-button ui-button-flat" title="Editar"/>
                            
                            <p:commandButton icon="pi pi-trash" action="#{cdtBean.eliminar(hist.cliente.docId)}" process="@this" update=":formTabla, :formularioCdt:msgs" styleClass="ui-button-danger rounded-button ui-button-flat" title="Eliminar">
                                <p:confirm header="Confirmación" message="¿Eliminar este CDT?" icon="pi pi-info-circle"/>
                            </p:commandButton>
                        </p:column>

                    </p:dataTable>
                </p:panel>
            </h:form>
        </div>
        
        <h:form id="formConfirmacion">
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes" />
            </p:confirmDialog>
        </h:form>

        <div class="footer">
            <p>Desarrollado por: Mary Leany Vaquiro Cardozo y Fredy antonio Linares Guerrero</p>
            <p>Asignatura: programación por componentes</p>
        </div>

    </h:body>
</html>
